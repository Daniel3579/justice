services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - ollama pull ${LLM_MODEL:-qwen3.5:4b} && ollama pull ${EMBEDDING_MODEL:-nomic-embed-text}
    restart: "no"

  backend:
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama-models: